apiVersion: v1
kind: ConfigMap
metadata:
  name: ${KTX_APP_NAME}
data:
  application.yaml: |
    server:
      port: 8080

    spring:
      liquibase:
        enabled: true
      datasource:
        url: jdbc:postgresql://${DB_ADDRESS}/${DB_NAME}
        username: ${DB_USER}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver

      mail:
        host: smtp.gmail.com
        port: 587
        username: ${SMTP_USER}
        password: ${SMTP_PASSWORD}
        properties:
          mail:
            smtp:
              auth: true
              starttls:
                enable: true
            transport:
              protocol: smtp
            debug: true

    token:
      secret-key: ${KTX_AUTH_SECRET}
      ttl: 24h
